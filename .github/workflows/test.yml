name: Pipeline Test

on:
  push:

jobs:
  mensaje:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Instala Java 21 y configura el JAVA_HOME automáticamente
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin' # 'temurin' es la más común y recomendada

    # 3. Ahora que JAVA_HOME ya existe, ejecutas tu comando
    - name: Build with Maven
      run: ./mvnw clean install