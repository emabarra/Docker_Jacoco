name: Java CI con JaCoCo

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Cambia a tu versión de Java
        distribution: 'temurin'
        cache: 'maven' # Usa 'gradle' si corresponde

    - name: Ejecutar Tests y JaCoCo (Maven)
      run: ./mvn clean test
      # Si usas Gradle, cambia por: run: ./gradlew test jacocoTestReport

    - name: Subir reporte de JaCoCo como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura-jacoco
        path: |
          **/target/site/jacoco/
          **/build/reports/jacoco/