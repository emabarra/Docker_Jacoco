name: Java CI con JaCoCo

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Ejecutar Tests y JaCoCo (Maven)
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      run: mvn clean test

    - name: Subir reporte de JaCoCo como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura-jacoco
        path: |
          **/target/site/jacoco/
          **/build/reports/jacoco/