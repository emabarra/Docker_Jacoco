name: Java CI con JaCoCo

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Añadimos este paso por seguridad: asegura que el wrapper tenga permisos para ejecutarse
    - name: Dar permisos de ejecución a mvnw
      run: chmod +x ./mvnw

    # Eliminamos el bloque 'env' que rompía el JAVA_HOME
    - name: Ejecutar Tests y JaCoCo (Maven)
      run: ./mvnw clean install

    - name: Subir reporte de JaCoCo como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura-jacoco
        path: |
          **/target/site/jacoco/
          **/build/reports/jacoco/